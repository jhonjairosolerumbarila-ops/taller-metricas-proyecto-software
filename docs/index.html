<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Métricas del Proyecto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f6f8fa;
            color: #24292f;
        }

        h1 {
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .label {
            font-size: 14px;
            color: #57606a;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 8px;
        }

        .risk-Alto {
            color: #cf222e;
        }

        .risk-Medio {
            color: #bf8700;
        }

        .risk-Bajo {
            color: #1a7f37;
        }
    </style>
</head>

<body>
    <h1>Dashboard de Métricas del Proyecto</h1>

    <p>Indicadores generados automáticamente desde GitHub Issues.</p>

    <div class="grid" id="metrics"></div>

    <script>
        const data = {"total_issues": 5, "closed_issues": 2, "open_issues": 3, "completion_rate_percent": 40.0, "total_bugs": 1, "open_bugs": 1, "closed_bugs": 0, "average_resolution_hours": 0.24, "estimated_hours": 10.0, "actual_hours": 10.0, "estimated_cost_usd": 200.0, "actual_cost_usd": 200.0, "cost_variance_usd": 0.0, "roi_percent": 200.0, "velocity_story_points": 3.0, "overdue_open_issues": 0, "risk_level": "Medio"};

        const labels = {
            total_issues: "Total de tareas",
            closed_issues: "Tareas cerradas",
            open_issues: "Tareas abiertas",
            completion_rate_percent: "Avance (%)",
            total_bugs: "Bugs totales",
            open_bugs: "Bugs abiertos",
            closed_bugs: "Bugs cerrados",
            average_resolution_hours: "Tiempo promedio de resolución (h)",
            estimated_hours: "Horas estimadas",
            actual_hours: "Horas reales",
            estimated_cost_usd: "Costo estimado (USD)",
            actual_cost_usd: "Costo real (USD)",
            cost_variance_usd: "Variación de costo (USD)",
            roi_percent: "ROI (%)",
            velocity_story_points: "Velocity",
            overdue_open_issues: "Tareas vencidas",
            risk_level: "Nivel de riesgo"
        };

        const container = document.getElementById("metrics");

        Object.entries(labels).forEach(function(entry) {
            const key = entry[0];
            const label = entry[1];
            const value = data[key] ?? "N/A";

            const card = document.createElement("div");
            card.className = "card";

            const labelDiv = document.createElement("div");
            labelDiv.className = "label";
            labelDiv.textContent = label;

            const valueDiv = document.createElement("div");
            valueDiv.className = "value";
            valueDiv.textContent = value;

            if (key === "risk_level") {
                valueDiv.classList.add("risk-" + value);
            }

            card.appendChild(labelDiv);
            card.appendChild(valueDiv);
            container.appendChild(card);
        });
    </script>
</body>
</html>
