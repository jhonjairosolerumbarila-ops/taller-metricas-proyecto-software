name: Actualizar métricas del proyecto

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write
  issues: read

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar issues desde GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh issue list --state all --limit 100 \
            --json number,title,body,labels,state,createdAt,closedAt,updatedAt,url \
            > data/issues.json

      - name: Calcular métricas
        run: python scripts/build_metrics.py

      - name: Crear dashboard HTML autosuficiente
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metrics_path = Path("docs/metrics.json")
          html_path = Path("docs/index.html")

          metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
          metrics_json = json.dumps(metrics, ensure_ascii=False)

          html = f"""<!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <title>Dashboard de Métricas del Proyecto</title>

              <style>
                  body {{
                      font-family: Arial, sans-serif;
                      margin: 40px;
                      background: #f6f8fa;
                      color: #24292f;
                  }}

                  h1 {{
                      margin-bottom: 10px;
                  }}

                  .grid {{
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                      gap: 16px;
                      margin-top: 24px;
                  }}

                  .card {{
                      background: white;
                      border-radius: 12px;
                      padding: 20px;
                      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                  }}

                  .label {{
                      font-size: 14px;
                      color: #57606a;
                  }}

                  .value {{
                      font-size: 32px;
                      font-weight: bold;
                      margin-top: 8px;
                  }}

                  .risk-Alto {{
                      color: #cf222e;
                  }}

                  .risk-Medio {{
                      color: #bf8700;
                  }}

                  .risk-Bajo {{
                      color: #1a7f37;
                  }}
              </style>
          </head>

          <body>
              <h1>Dashboard de Métricas del Proyecto</h1>

              <p>Indicadores generados automáticamente desde GitHub Issues.</p>

              <div class="grid" id="metrics"></div>

              <script>
                  const data = {metrics_json};

                  const labels = {{
                      total_issues: "Total de tareas",
                      closed_issues: "Tareas cerradas",
                      open_issues: "Tareas abiertas",
                      completion_rate_percent: "Avance (%)",
                      total_bugs: "Bugs totales",
                      open_bugs: "Bugs abiertos",
                      closed_bugs: "Bugs cerrados",
                      average_resolution_hours: "Tiempo promedio de resolución (h)",
                      estimated_hours: "Horas estimadas",
                      actual_hours: "Horas reales",
                      estimated_cost_usd: "Costo estimado (USD)",
                      actual_cost_usd: "Costo real (USD)",
                      cost_variance_usd: "Variación de costo (USD)",
                      roi_percent: "ROI (%)",
                      velocity_story_points: "Velocity",
                      overdue_open_issues: "Tareas vencidas",
                      risk_level: "Nivel de riesgo"
                  }};

                  const container = document.getElementById("metrics");

                  Object.entries(labels).forEach(([key, label]) => {{
                      const card = document.createElement("div");
                      const value = data[key] ?? "N/A";

                      card.className = "card";

                      if (key === "risk_level") {{
                          card.innerHTML = `
                              <div class="label">${{label}}</div>
                              <div class="value risk-${{value}}">${{value}}</div>
                          `;
                      }} else {{
                          card.innerHTML = `
                              <div class="label">${{label}}</div>
                              <div class="value">${{value}}</div>
                          `;
                      }}

                      container.appendChild(card);
                  }});
              </script>
          </body>
          </html>
          """

          html_path.parent.mkdir(parents=True, exist_ok=True)
          html_path.write_text(html, encoding="utf-8")
          PY

      - name: Guardar métricas y dashboard en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/issues.json docs/metrics.json docs/index.html

          git diff --staged --quiet || git commit -m "chore: actualizar métricas automáticas"

          git push

      - name: Subir artefacto del dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-metricas-proyecto
          path: |
            docs/index.html
            docs/metrics.json
            data/issues.json
